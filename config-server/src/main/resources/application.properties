spring.application.name=config-server
server.port=8888

# Use native profile to look up local/classpath configuration properties
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo,file:/config-repo

# Register with Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
eureka.client.enabled=true
spring.cloud.discovery.enabled=true

logging.level.org.springframework.cloud.config=INFO
