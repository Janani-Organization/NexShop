# Centralized Gateway Routing to Downstream Microservices utilizing Eureka Load Balancing (lb://)
# Product Service
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/products/**

# Order Service
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

# Cart Service
spring.cloud.gateway.routes[2].id=cart-service
spring.cloud.gateway.routes[2].uri=lb://cart-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/cart/**

# Wishlist (handled by Cart Service)
spring.cloud.gateway.routes[3].id=wishlist-service
spring.cloud.gateway.routes[3].uri=lb://cart-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/wishlist/**

# AI Service
spring.cloud.gateway.routes[4].id=AI-service
spring.cloud.gateway.routes[4].uri=lb://AI-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/ai/**

# User / Auth Service
spring.cloud.gateway.routes[5].id=user-service
spring.cloud.gateway.routes[5].uri=lb://user-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/auth/**

# Coupon (handled by Order Service)
spring.cloud.gateway.routes[6].id=coupon-service
spring.cloud.gateway.routes[6].uri=lb://order-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/coupons/**

# Payout (handled by Order Service)
spring.cloud.gateway.routes[7].id=payout-service
spring.cloud.gateway.routes[7].uri=lb://order-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/payouts/**

# Reviews (handled by Product Service)
spring.cloud.gateway.routes[8].id=review-service
spring.cloud.gateway.routes[8].uri=lb://product-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/reviews/**

# Seller (handled by Product Service)
spring.cloud.gateway.routes[9].id=seller-service
spring.cloud.gateway.routes[9].uri=lb://product-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/seller/**

# Payments (handled by Order Service)
spring.cloud.gateway.routes[10].id=payment-service
spring.cloud.gateway.routes[10].uri=lb://order-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/payments/**

# WebSockets (handled by User Service)
spring.cloud.gateway.routes[11].id=websocket-service
spring.cloud.gateway.routes[11].uri=lb://user-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/ws/**

# Image Service (handled by Product Service)
spring.cloud.gateway.routes[12].id=image-service
spring.cloud.gateway.routes[12].uri=lb://product-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/images/**
