apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: jananisivasankar/ai-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"

            - name: EUREKA_SERVER_URL
              value: "http://eureka-server:8761/eureka/"

            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin:9411/api/v2/spans"