apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: revshop-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # API requests -> API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000

          # Image requests -> API Gateway
          - path: /images
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000

          # WebSocket requests -> API Gateway
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000

          # Swagger UI -> API Gateway
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000

          # API docs -> API Gateway
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000

          # Everything else -> Frontend (React app)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
