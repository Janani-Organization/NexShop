apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      initContainers:
        - name: wait-for-config-server
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z config-server 8888; do echo waiting for config-server; sleep 3; done;']
      containers:
        - name: eureka-server
          image: jananisivasankar/eureka-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  type: ClusterIP
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: eureka-server